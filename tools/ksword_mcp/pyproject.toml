[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksword-mcp"
version = "0.1.0"
description = "KSword MCP server for GUI, native CLI and raw driver IOCTL access"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-KSword-Community-Source-1.6"
license-files = ["LICENSE"]
authors = [{name = "KSwordDEV"}]
dependencies = ["mcp>=1.26,<2", "jsonschema>=4.20,<5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/KSwordDEV/MCP"
Repository = "https://github.com/KSwordDEV/MCP"
Issues = "https://github.com/KSwordDEV/MCP/issues"

[project.scripts]
ksword-mcp = "ksword_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ksword_mcp*"]
